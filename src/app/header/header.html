<header class="site-header">
  <a routerLink="/" class="logo">BOLT<span>RAIL</span></a>

  <button class="menu-toggle" type="button" (click)="toggleMenu()" aria-label="Toggle navigation">
    <span></span><span></span><span></span>
  </button>

  <nav class="nav-links" [class.open]="menuOpen()">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
    <a routerLink="/trains" routerLinkActive="active" (click)="closeMenu()">Trains</a>
    <div class="mobile-actions">
      <button class="btn primary" routerLink="/register" (click)="closeMenu()">Get started</button>
      <button class="btn" routerLink="/sign-in" (click)="closeMenu()">Sign in</button>
    </div>
  </nav>

  <div class="nav-actions">
    <button
      class="theme-toggle"
      type="button"
      [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      (click)="toggleTheme()"
    >
      @if (theme.isDark()) {
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#7c5cff">
          <path d="M338.5-338.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#5b3df5">
          <path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/>
        </svg>
      }
    </button>
    @if (auth.isLoggedIn()) {
      <a class="btn primary" routerLink="/profile">My Profile</a>
    } @else {
      <button class="btn primary" routerLink="/register">Get started</button>
      <button class="btn" routerLink="/sign-in">Sign in</button>
    }
  </div>
</header>
